[project]
name = "piku-ocr"
version = "1.0.0"
description = "Piku OCR: from-scratch two-model OCR (Piku-Eye reader + Piku-Brain corrector) for Bangla, English and Russian."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "pillow>=10.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["piku_ocr*"]
